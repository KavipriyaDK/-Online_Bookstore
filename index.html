<!DOCTYPE html>
<html><head><title>Online Bookstore</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f0}
header{background:#6b2d5c;color:#fff;padding:18px;text-align:center}
.wrap{padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:#fff;padding:12px;border-radius:8px;border:1px solid #ddd}
.in{color:green}.out{color:red}
input{padding:8px;width:260px}button{padding:6px 10px;margin-top:6px}
</style></head>
<body>
<header><h1>Online Bookstore</h1></header>
<div class="wrap">
<input id="q" placeholder="Search by title or author" oninput="render()">
<div class="grid" id="grid"></div>
<h2>Cart</h2><ul id="cart"></ul>
<button onclick="order()">Place Order</button>
<h2>Order Status</h2><p id="status">No orders yet</p>
</div>
<script>
const books=[
{t:"Clean Code",a:"Robert Martin",c:"Programming",p:550,s:true},
{t:"The Pragmatic Programmer",a:"Hunt & Thomas",c:"Programming",p:620,s:true},
{t:"Wings of Fire",a:"A.P.J. Abdul Kalam",c:"Biography",p:300,s:true},
{t:"Atomic Habits",a:"James Clear",c:"Self-help",p:450,s:false},
{t:"Ponniyin Selvan",a:"Kalki",c:"Fiction",p:700,s:true},
{t:"The Phoenix Project",a:"Gene Kim",c:"DevOps",p:520,s:true}];
let cart=[];
function render(){const q=document.getElementById('q').value.toLowerCase();
document.getElementById('grid').innerHTML=books.map((b,i)=>
(b.t+b.a).toLowerCase().includes(q)?`<div class="card"><h3>${b.t}</h3><p>${b.a}</p><p>${b.c} | Rs.${b.p}</p>
<p class="${b.s?'in':'out'}">${b.s?'In Stock':'Out of Stock'}</p>
<button ${b.s?'':'disabled'} onclick="add(${i})">Add to Cart</button></div>`:'').join('');}
function add(i){cart.push(books[i]);document.getElementById('cart').innerHTML=cart.map(b=>`<li>${b.t} - Rs.${b.p}</li>`).join('');}
function order(){if(!cart.length)return;document.getElementById('status').innerText='Order placed: Processing -> Shipped -> Delivered';cart=[];document.getElementById('cart').innerHTML='';}
render();
</script></body></html>
